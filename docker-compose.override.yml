# Development overrides, applied automatically by `docker compose up`.
# Source folders are bind-mounted for hot reload; node_modules stay inside the images.
services:
  migrate:
    environment:
      NODE_ENV: development

  api:
    build:
      target: dev
    environment:
      NODE_ENV: development
      # Per-file fs.watch misses changes on VM bind mounts (Colima/Docker Desktop);
      # watching the parent directory picks them up.
      TSC_WATCHFILE: UseFsEventsOnParentDirectory
    volumes:
      - ./apps/api/src:/app/apps/api/src
      - ./apps/api/prisma:/app/apps/api/prisma
      - ./packages/shared/src:/app/packages/shared/src
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 3s
      start_period: 60s
      retries: 10

  web:
    build:
      target: dev
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001/api/v1}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    volumes:
      - ./apps/web/src:/app/apps/web/src
      - ./apps/web/public:/app/apps/web/public
